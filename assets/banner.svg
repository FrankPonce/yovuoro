  <g font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#64748B"><text x="706.5" y="274" text-anchor="middle">12:00</text><text x="820.5" y="274" text-anchor="middle">18:00</text><text x="934.5" y="274" text-anchor="middle">00:00</text><text x="1048.5" y="274" text-anchor="middle">06:00</text></g>

  <rect width="780" height="300" fill="url(#fade)"/>

  <g font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="56" y="76" fill="#94A3B8" font-size="15" font-weight="600" letter-spacing="3">NOKIA STUDENT NETWORK CHALLENGE 2026 · AI-RAN</text>
    <text x="56" y="132" fill="#F1F5F9" font-size="44" font-weight="800" letter-spacing="2">YÖVUORO <tspan fill="#A5B4FC" font-size="22" font-style="italic" font-weight="600" letter-spacing="0.5">the night shift</tspan></text>
    <text x="56" y="172" fill="#94A3B8" font-size="20">The radio always wins. <tspan fill="#4ADE80">The GPU pays its way.</tspan></text>

    <g font-size="15" font-weight="600" fill="#F1F5F9">
      <rect x="56" y="204" width="104" height="34" rx="17" fill="#111A2E" stroke="#26324D"/>
      <circle cx="76" cy="221" r="6" fill="#94A3B8"/><text x="90" y="226">Sleep</text>
      <rect x="172" y="204" width="98" height="34" rx="17" fill="#111A2E" stroke="#26324D"/>
      <circle cx="192" cy="221" r="6" fill="#22C55E"/><text x="206" y="226">Lend</text>
      <rect x="282" y="204" width="114" height="34" rx="17" fill="#111A2E" stroke="#26324D"/>
      <circle cx="302" cy="221" r="6" fill="#6366F1"/><text x="316" y="226">Admit</text>
